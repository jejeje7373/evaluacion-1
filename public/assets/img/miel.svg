<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Frasco de Miel Orgánica artesanal pura de HuertoHogar">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="40%" stop-color="#FFB300"/>
      <stop offset="85%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8E1"/>
    </linearGradient>
    <filter id="shadow7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad7)"/>
  <ellipse cx="150" cy="205" rx="80" ry="14" fill="#E0E0E0"/>

  <g filter="url(#shadow7)" transform="translate(150,115)">
    <!-- Frasco de vidrio -->
    <rect x="-48" y="-35" width="96" height="85" rx="10" fill="url(#honeyGrad)"/>
    <rect x="-48" y="-35" width="96" height="85" rx="10" fill="url(#jarGlass)"/>

    <!-- Etiqueta de papel kraft con abeja -->
    <rect x="-38" y="-15" width="76" height="48" rx="4" fill="#FFFDE7" stroke="#FFB300" stroke-width="1.5"/>
    <!-- Pequeño hexágono / panal -->
    <polygon points="0,-8 6,-4 6,4 0,8 -6,4 -6,-4" fill="#FFD54F" stroke="#FF8F00" stroke-width="1"/>
    <text x="0" y="16" font-family="'Playfair Display', serif" font-size="9" font-weight="bold" fill="#8B4513" text-anchor="middle">MIEL PURA</text>
    <text x="0" y="26" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="bold" fill="#2E8B57" text-anchor="middle">100% ORGÁNICA</text>

    <!-- Cuello del frasco -->
    <rect x="-36" y="-50" width="72" height="15" rx="3" fill="#E0E0E0" opacity="0.8"/>

    <!-- Tapa de tela rústica con cordón -->
    <path d="M -44 -50 Q 0 -68 44 -50 L 40 -40 L -40 -40 Z" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5"/>
    <path d="M -42 -44 Q 0 -41 42 -44" stroke="#5D4037" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Cordel colgando -->
    <path d="M 28 -44 Q 38 -35 34 -25 Q 30 -18 36 -12" stroke="#5D4037" stroke-width="2" fill="none"/>
    <circle cx="36" cy="-12" r="3" fill="#8D6E63"/>

    <!-- Palitroque para miel (mielero) al lado -->
    <g transform="translate(60, 10) rotate(25)">
      <rect x="-3" y="-70" width="6" height="65" rx="3" fill="#BCAAA4"/>
      <!-- Espirales del mielero -->
      <ellipse cx="0" cy="-5" rx="14" ry="5" fill="#8D6E63"/>
      <ellipse cx="0" cy="-15" rx="16" ry="5" fill="#A1887F"/>
      <ellipse cx="0" cy="-25" rx="14" ry="5" fill="#8D6E63"/>
      <ellipse cx="0" cy="-35" rx="10" ry="4" fill="#A1887F"/>
      <!-- Gota de miel -->
      <path d="M 0 0 C -4 8 -4 14 0 16 C 4 14 4 8 0 0 Z" fill="#FFB300"/>
    </g>
  </g>
</svg>

