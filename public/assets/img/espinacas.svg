<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Espinacas Frescas y nutritivas de HuertoHogar">
  <defs>
    <linearGradient id="spinach1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="spinach2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad5)"/>
  <ellipse cx="150" cy="205" rx="85" ry="14" fill="#E0E0E0"/>

  <g filter="url(#shadow5)">
    <!-- Hojas traseras -->
    <path d="M 120 180 C 80 140 70 80 110 50 C 145 75 140 130 120 180 Z" fill="url(#spinach2)"/>
    <path d="M 165 185 C 205 145 220 85 180 55 C 150 80 150 135 165 185 Z" fill="url(#spinach1)"/>

    <!-- Hoja central superior -->
    <path d="M 145 185 C 110 130 110 65 145 35 C 180 65 180 130 145 185 Z" fill="#2E7D32"/>
    <path d="M 145 185 L 145 42" stroke="#A5D6A7" stroke-width="2.5" fill="none"/>
    <path d="M 145 140 Q 130 120 125 105" stroke="#A5D6A7" stroke-width="1.8" fill="none"/>
    <path d="M 145 140 Q 160 120 165 105" stroke="#A5D6A7" stroke-width="1.8" fill="none"/>
    <path d="M 145 100 Q 133 85 130 70" stroke="#A5D6A7" stroke-width="1.8" fill="none"/>
    <path d="M 145 100 Q 157 85 160 70" stroke="#A5D6A7" stroke-width="1.8" fill="none"/>

    <!-- Hojas frontales abiertas -->
    <path d="M 135 190 C 75 165 60 115 95 100 C 130 115 135 155 135 190 Z" fill="url(#spinach1)"/>
    <path d="M 155 190 C 215 165 230 115 195 100 C 160 115 155 155 155 190 Z" fill="url(#spinach2)"/>

    <!-- Tallo agrupado con lazo rústico -->
    <rect x="135" y="178" width="22" height="15" rx="3" fill="#8B4513"/>
    <text x="146" y="189" font-family="'Montserrat', sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">500g</text>
  </g>
</svg>

