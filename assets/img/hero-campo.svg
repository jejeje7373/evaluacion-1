<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-label="Campos agrícolas fértiles de Chile y canasta de productos frescos de HuertoHogar">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9F0FA" />
      <stop offset="60%" stop-color="#F2F9FC" />
      <stop offset="100%" stop-color="#E5F3D8" />
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70C1B3" />
      <stop offset="100%" stop-color="#4B9A8B" />
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="crateWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A25B2A" />
      <stop offset="100%" stop-color="#7A3E14" />
    </linearGradient>
    <radialGradient id="sunHero" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#FFD700" />
    </radialGradient>
    <filter id="dropShad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cielo y Sol -->
  <rect width="600" height="400" rx="16" fill="url(#skyGrad)" />
  <circle cx="480" cy="90" r="50" fill="url(#sunHero)" opacity="0.8" />
  <circle cx="480" cy="90" r="65" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Montañas cordilleranas de fondo -->
  <polygon points="50,220 160,110 270,220" fill="#B0BEC5" opacity="0.45" />
  <polygon points="120,135 160,110 185,135 170,145 150,140 135,148" fill="#ECEFF1" opacity="0.8" />
  <polygon points="210,220 330,90 450,220" fill="#90A4AE" opacity="0.5" />
  <polygon points="280,125 330,90 365,125 350,135 325,130 305,140" fill="#ECEFF1" opacity="0.8" />

  <!-- Colinas verdes del Valle Central -->
  <path d="M 0 260 Q 150 180 320 250 T 600 230 L 600 400 L 0 400 Z" fill="url(#hill1)" opacity="0.75" />
  <path d="M 0 290 Q 200 230 400 300 T 600 270 L 600 400 L 0 400 Z" fill="url(#hill2)" />

  <!-- Surcos de cultivo agrícola -->
  <path d="M 50 400 L 140 285 M 120 400 L 190 285 M 200 400 L 250 290" stroke="#1B5E20" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Cesta de madera con cosecha fresca en primer plano -->
  <g transform="translate(240, 160)" filter="url(#dropShad)">
    <!-- Canasta de madera -->
    <rect x="50" y="110" width="220" height="90" rx="8" fill="url(#crateWood)" stroke="#5D2D0C" stroke-width="3" />
    <line x1="50" y1="140" x2="270" y2="140" stroke="#5D2D0C" stroke-width="2" />
    <line x1="50" y1="170" x2="270" y2="170" stroke="#5D2D0C" stroke-width="2" />
    <line x1="100" y1="110" x2="100" y2="200" stroke="#5D2D0C" stroke-width="2" />
    <line x1="220" y1="110" x2="220" y2="200" stroke="#5D2D0C" stroke-width="2" />

    <!-- Etiqueta HuertoHogar -->
    <rect x="110" y="145" width="100" height="32" rx="4" fill="#F7F7F7" stroke="#2E8B57" stroke-width="2" />
    <text x="160" y="166" font-family="'Montserrat', sans-serif" font-size="11" font-weight="bold" fill="#2E8B57" text-anchor="middle">100% ORGÁNICO</text>

    <!-- Frutas y verduras dentro de la canasta -->
    <!-- Zanahorias -->
    <polygon points="70,110 60,60 85,75" fill="#FF7043" />
    <path d="M 60 60 Q 50 40 45 35 M 60 60 Q 60 35 65 30 M 60 60 Q 75 45 78 40" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Manzanas rojas -->
    <circle cx="115" cy="95" r="24" fill="#D32F2F" />
    <circle cx="110" cy="90" r="6" fill="#FF8A80" opacity="0.6" />
    <path d="M 115 72 Q 120 65 125 68" stroke="#5D4037" stroke-width="3" fill="none" />
    <path d="M 120 70 Q 130 65 132 72 Q 125 76 120 70 Z" fill="#43A047" />

    <!-- Naranjas -->
    <circle cx="160" cy="98" r="25" fill="#FF9800" />
    <circle cx="155" cy="92" r="5" fill="#FFE082" opacity="0.5" />
    <circle cx="160" cy="74" r="3" fill="#33691E" />

    <!-- Pimientos tricolores -->
    <path d="M 195 90 C 190 75 225 75 220 90 C 220 115 195 115 195 90 Z" fill="#FBC02D" />
    <path d="M 215 95 C 210 80 245 80 240 95 C 240 120 215 120 215 95 Z" fill="#43A047" />
    <path d="M 207 77 L 208 70" stroke="#33691E" stroke-width="3" stroke-linecap="round" />

    <!-- Hojas frescas sobresaliendo -->
    <path d="M 90 90 Q 70 70 85 55 Q 98 75 90 90 Z" fill="#2E7D32" />
    <path d="M 235 90 Q 255 70 245 55 Q 230 75 235 90 Z" fill="#2E8B57" />
  </g>

  <!-- Distintivo de garantía -->
  <g transform="translate(30, 40)">
    <rect width="180" height="50" rx="25" fill="#FFFFFF" opacity="0.95" filter="url(#dropShad)" />
    <circle cx="28" cy="25" r="18" fill="#2E8B57" />
    <path d="M 22 25 L 26 29 L 34 20" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="23" font-family="'Montserrat', sans-serif" font-size="11" font-weight="bold" fill="#333333">COSECHA DEL DÍA</text>
    <text x="56" y="38" font-family="'Montserrat', sans-serif" font-size="9" fill="#666666">Directo a tu puerta en Chile</text>
  </g>
</svg>

