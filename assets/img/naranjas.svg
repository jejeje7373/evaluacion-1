<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Naranjas Valencia jugosas y ricas en vitamina C de HuertoHogar">
  <defs>
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="85%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <radialGradient id="sliceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="70%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </radialGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8E1"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad2)"/>
  <ellipse cx="145" cy="205" rx="85" ry="14" fill="#E0E0E0"/>

  <!-- Naranja entera -->
  <g filter="url(#shadow2)">
    <circle cx="120" cy="115" r="62" fill="url(#orangeGrad)"/>
    <!-- Puntos de textura de cáscara -->
    <circle cx="105" cy="85" r="2" fill="#E65100" opacity="0.3"/>
    <circle cx="135" cy="95" r="2" fill="#E65100" opacity="0.3"/>
    <circle cx="95" cy="125" r="2" fill="#E65100" opacity="0.3"/>
    <circle cx="130" cy="140" r="2" fill="#E65100" opacity="0.3"/>
    <circle cx="90" cy="85" r="16" fill="#FFE0B2" opacity="0.35"/>
    <!-- Hojas del pedúnculo -->
    <path d="M 120 53 Q 130 35 150 38 Q 145 52 120 53 Z" fill="#2E7D32"/>
    <path d="M 120 53 Q 105 38 90 42 Q 100 52 120 53 Z" fill="#388E3C"/>
    <circle cx="120" cy="53" r="3.5" fill="#33691E"/>
  </g>

  <!-- Rodaja de naranja en primer plano -->
  <g filter="url(#shadow2)" transform="translate(195,145)">
    <circle cx="0" cy="0" r="42" fill="#FB8C00"/>
    <circle cx="0" cy="0" r="39" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="36" fill="url(#sliceGrad)"/>
    <!-- Gajos -->
    <path d="M 0 0 L -8 -30 A 32 32 0 0 1 8 -30 Z" fill="#FFA726"/>
    <path d="M 0 0 L 22 -22 A 32 32 0 0 1 30 -6 Z" fill="#FFA726"/>
    <path d="M 0 0 L 30 8 A 32 32 0 0 1 22 24 Z" fill="#FFA726"/>
    <path d="M 0 0 L 8 30 A 32 32 0 0 1 -8 30 Z" fill="#FFA726"/>
    <path d="M 0 0 L -22 22 A 32 32 0 0 1 -30 6 Z" fill="#FFA726"/>
    <path d="M 0 0 L -30 -8 A 32 32 0 0 1 -22 -24 Z" fill="#FFA726"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>

