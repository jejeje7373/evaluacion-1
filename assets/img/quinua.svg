<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Bolsa de Quinua Orgánica en grano premium de HuertoHogar">
  <defs>
    <linearGradient id="sackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="50%" stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </linearGradient>
    <radialGradient id="grainGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="70%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </radialGradient>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFEBE9"/>
    </linearGradient>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad8)"/>
  <ellipse cx="150" cy="205" rx="85" ry="14" fill="#E0E0E0"/>

  <g filter="url(#shadow8)" transform="translate(150,120)">
    <!-- Saco de arpillera / papel kraft rústico -->
    <path d="M -50 65 C -55 40 -50 -20 -40 -35 C -30 -42 30 -42 40 -35 C 50 -20 55 40 50 65 C 30 75 -30 75 -50 65 Z" fill="url(#sackGrad)"/>
    
    <!-- Pliegues superiores de la bolsa abierta -->
    <ellipse cx="0" cy="-35" rx="40" ry="12" fill="#8D6E63"/>
    
    <!-- Montículo de granos dorados de quinua sobresaliendo -->
    <ellipse cx="0" cy="-33" rx="36" ry="10" fill="url(#grainGrad)"/>
    <!-- Granos individuales visibles -->
    <circle cx="-15" cy="-34" r="2" fill="#FFE082"/>
    <circle cx="-5" cy="-32" r="2.2" fill="#FFF59D"/>
    <circle cx="8" cy="-35" r="2" fill="#FFE082"/>
    <circle cx="20" cy="-33" r="1.8" fill="#FFF59D"/>
    <circle cx="2" cy="-29" r="2.1" fill="#FFE082"/>

    <!-- Costura y etiqueta rústica -->
    <rect x="-35" y="-5" width="70" height="42" rx="4" fill="#FFFFFF" stroke="#8D6E63" stroke-width="1.5"/>
    <text x="0" y="10" font-family="'Playfair Display', serif" font-size="9" font-weight="bold" fill="#8B4513" text-anchor="middle">QUINUA REAL</text>
    <text x="0" y="22" font-family="'Montserrat', sans-serif" font-size="7" font-weight="600" fill="#2E8B57" text-anchor="middle">GRANO ANDINO</text>
    <text x="0" y="31" font-family="'Montserrat', sans-serif" font-size="6" fill="#666666" text-anchor="middle">100% CULTIVO NATURAL</text>

    <!-- Hilo de cosido en la bolsa -->
    <path d="M -42 -22 Q 0 -20 42 -22" stroke="#5D4037" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>
  </g>
</svg>

