<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Plátanos Cavendish maduros y dulces de HuertoHogar">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="50%" stop-color="#FFEB3B"/>
      <stop offset="85%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFDE7"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad3)"/>
  <ellipse cx="150" cy="205" rx="90" ry="14" fill="#E0E0E0"/>

  <g filter="url(#shadow3)">
    <!-- Racimo de plátanos Cavendish -->
    <!-- Plátano posterior -->
    <path d="M 75 80 C 110 50 200 65 235 125 C 215 135 130 90 75 80 Z" fill="#FBC02D" opacity="0.8"/>

    <!-- Plátano central -->
    <path d="M 70 85 C 100 60 215 80 245 155 C 230 162 120 110 70 85 Z" fill="url(#bananaGrad)"/>
    <path d="M 70 85 C 110 78 200 105 238 158" stroke="#F57F17" stroke-width="2" fill="none" opacity="0.5"/>

    <!-- Plátano frontal -->
    <path d="M 68 95 C 100 80 195 105 225 175 C 205 180 115 135 68 95 Z" fill="#FFF176"/>
    <!-- Bordes y puntas -->
    <path d="M 62 90 L 72 98 L 68 102 L 58 94 Z" fill="#5D4037"/>
    <path d="M 225 175 C 228 178 230 180 231 183 L 227 184 C 225 181 223 178 221 176 Z" fill="#5D4037"/>

    <!-- Unión del racimo -->
    <path d="M 55 75 Q 65 65 78 80 L 72 95 Q 58 85 55 75 Z" fill="#689F38"/>
    <circle cx="58" cy="74" r="6" fill="#33691E"/>
  </g>
</svg>

