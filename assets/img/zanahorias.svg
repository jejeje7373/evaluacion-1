<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Zanahorias Orgánicas crujientes de la Región de O'Higgins">
  <defs>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="60%" stop-color="#F4511E"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBE9E7"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad4)"/>
  <ellipse cx="150" cy="205" rx="85" ry="14" fill="#E0E0E0"/>

  <g filter="url(#shadow4)" transform="translate(150,115) rotate(-35)">
    <!-- Hojas verdes frondosas -->
    <path d="M 0 -70 C -15 -105 -35 -125 -40 -135 C -30 -115 -10 -95 0 -70 Z" fill="#2E7D32"/>
    <path d="M 0 -70 C 0 -110 5 -135 10 -145 C 5 -120 -5 -95 0 -70 Z" fill="#388E3C"/>
    <path d="M 0 -70 C 20 -105 40 -125 48 -135 C 32 -115 15 -95 0 -70 Z" fill="#43A047"/>
    <path d="M -5 -70 C -25 -95 -50 -105 -55 -115 C -40 -100 -20 -85 -5 -70 Z" fill="#1B5E20"/>
    <path d="M 5 -70 C 28 -95 55 -100 65 -110 C 45 -95 25 -85 5 -70 Z" fill="#66BB6A"/>

    <!-- Cuerpo de la zanahoria -->
    <path d="M -22 -65 C -22 -75 22 -75 22 -65 C 18 10 5 70 0 95 C -5 70 -18 10 -22 -65 Z" fill="url(#carrotGrad)"/>
    
    <!-- Estrías horizontales características -->
    <path d="M -14 -40 Q -5 -38 12 -42" stroke="#BF360C" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M -12 -15 Q 0 -13 14 -18" stroke="#BF360C" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M -8 15 Q -2 17 8 13" stroke="#BF360C" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M -6 45 Q 0 46 6 44" stroke="#BF360C" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M -3 70 Q 0 71 3 69" stroke="#BF360C" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Brillo -->
    <path d="M -16 -60 C -12 -10 -6 30 -2 60" stroke="#FFAB91" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>
</svg>

