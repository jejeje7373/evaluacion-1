<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Manzanas Fuji crujientes y dulces de HuertoHogar">
  <defs>
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="45%" stop-color="#D32F2F"/>
      <stop offset="90%" stop-color="#B71C1C"/>
      <stop offset="100%" stop-color="#7F0000"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F8E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>
  <!-- Sombra base -->
  <ellipse cx="150" cy="205" rx="80" ry="14" fill="#E0E0E0"/>
  
  <!-- Manzana principal -->
  <g filter="url(#shadow)" transform="translate(150,115)">
    <!-- Tallo -->
    <path d="M 0 -60 C 5 -75 20 -80 25 -85" stroke="#5D4037" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Hoja -->
    <path d="M 5 -72 C 25 -85 45 -75 42 -60 C 25 -55 10 -65 5 -72 Z" fill="#43A047"/>
    <path d="M 7 -70 Q 25 -68 38 -62" stroke="#2E7D32" stroke-width="1.5" fill="none"/>
    <!-- Cuerpo de manzana Fuji -->
    <path d="M 0 -50 C 35 -58 68 -25 68 20 C 68 55 45 75 22 75 C 8 75 0 68 -3 68 C -6 68 -14 75 -28 75 C -50 75 -72 55 -72 20 C -72 -25 -40 -58 0 -50 Z" fill="url(#appleGrad)"/>
    <!-- Brillo -->
    <ellipse cx="-28" cy="-15" rx="14" ry="24" transform="rotate(-25 -28 -15)" fill="#FF8A80" opacity="0.45"/>
    <circle cx="-32" cy="-22" r="5" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>

