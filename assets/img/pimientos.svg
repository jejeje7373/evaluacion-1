<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%" role="img" aria-label="Pimientos Tricolores rojo amarillo y verde de HuertoHogar">
  <defs>
    <radialGradient id="redPepper" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EF5350"/>
      <stop offset="60%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#C62828"/>
    </radialGradient>
    <radialGradient id="yellowPepper" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="60%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
    <radialGradient id="greenPepper" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="60%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFDE7"/>
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="300" height="240" rx="12" fill="url(#bgGrad6)"/>
  <ellipse cx="150" cy="205" rx="90" ry="14" fill="#E0E0E0"/>

  <g filter="url(#shadow6)">
    <!-- Pimiento Amarillo (fondo izquierda) -->
    <g transform="translate(85,120) scale(0.85)">
      <!-- Tallo -->
      <path d="M 0 -45 Q 10 -65 15 -70" stroke="#33691E" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Lóbulos -->
      <path d="M -30 -40 C -45 -10 -40 30 -25 50 C -5 60 10 50 15 50 C 25 50 40 30 35 -10 C 30 -40 10 -45 -5 -40 Z" fill="url(#yellowPepper)"/>
      <path d="M -15 -42 C 5 -42 15 -10 15 45" stroke="#F9A825" stroke-width="2" fill="none" opacity="0.4"/>
    </g>

    <!-- Pimiento Verde (fondo derecha) -->
    <g transform="translate(205,125) scale(0.85)">
      <path d="M 0 -45 Q -10 -65 -15 -70" stroke="#2E7D32" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M -30 -40 C -45 -10 -40 30 -25 50 C -5 60 10 50 15 50 C 25 50 40 30 35 -10 C 30 -40 10 -45 -5 -40 Z" fill="url(#greenPepper)"/>
      <path d="M -15 -42 C 5 -42 15 -10 15 45" stroke="#2E7D32" stroke-width="2" fill="none" opacity="0.4"/>
    </g>

    <!-- Pimiento Rojo (primer plano central) -->
    <g transform="translate(145,130)">
      <!-- Tallo -->
      <path d="M 0 -45 Q 8 -68 5 -75" stroke="#33691E" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Cáliz verde -->
      <path d="M -15 -42 Q 0 -35 15 -42 Q 8 -50 0 -45 Q -8 -50 -15 -42 Z" fill="#2E7D32"/>
      <!-- Lóbulos del pimiento -->
      <path d="M -38 -35 C -55 -5 -50 40 -30 65 C -8 78 12 65 18 65 C 32 65 52 40 45 -5 C 38 -35 12 -42 -8 -38 Z" fill="url(#redPepper)"/>
      <!-- Pliegues y brillos -->
      <path d="M -18 -36 C 6 -36 18 -5 18 60" stroke="#B71C1C" stroke-width="2.5" fill="none" opacity="0.4"/>
      <ellipse cx="-20" cy="5" rx="8" ry="25" fill="#FF8A80" opacity="0.45" transform="rotate(-15 -20 5)"/>
    </g>
  </g>
</svg>

